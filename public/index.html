<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width">
  <title>mymizu</title>

  <!-- The map fills ~91% of a mobile viewport, so the Google Maps tiles are the
       LCP element. The Maps script is requested by google-map-react only after
       our bundle has run, so warming these connections up front removes the
       DNS + TLS handshakes from the front of that download. -->
  <link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://maps.googleapis.com">
  <link rel="dns-prefetch" href="https://maps.gstatic.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- The logo is the first contentful paint, so fetch it alongside the CSS
       rather than waiting for the parser to reach the navbar markup. -->
  <link rel="preload" as="image" href="/public/images/logo.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

  <!-- bootstrap-icons is 11KB of render-blocking CSS from a third-party origin,
       used for three social icons in the footer — below the fold on every
       viewport. Load it without blocking the first paint. The <noscript> keeps
       it working when JS is unavailable. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css" media="print" onload="this.media='all';this.onload=null">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css"></noscript>

  <link rel="stylesheet" href="/public/styles/main.css">
  <link rel="stylesheet" href="/public/styles/metrics.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon-16x16.png">
</head>

<body>
  <div id="root"></div>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
  <script src="/bundle.js"></script>
  <div id="ga"></div>
</body>

</html>
